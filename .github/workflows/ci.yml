name: CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main", "arena/**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print environment info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      - name: Run a successful test
        run: |
          echo "Running tests..."
          exit 0
